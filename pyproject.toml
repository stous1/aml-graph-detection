[project]
name = "lavado"
version = "0.1.0"
description = "Detección de lavado de activos en redes de transferencias con AMLworld (caso 2 del portafolio de banca)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sergio Tous" }]
dependencies = [
    "duckdb",
    "pandas",
    "pyarrow",
    "numpy",
    "python-igraph",
    "altair",
    "vl-convert-python",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lavado"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracion: pruebas del flujo completo (más lentas)",
]
