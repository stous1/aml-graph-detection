[project]
name = "lavado"
version = "0.1.0"
description = "Detección de lavado de activos en redes de transferencias con AMLworld (caso 2 del portafolio de banca)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Sergio Tous" }]
dependencies = [
    "duckdb",
    "pandas",
    "pyarrow",
    "numpy",
    "python-igraph",
    "altair",
    "vl-convert-python",
    "scikit-learn>=1.9.1",
    "pytorch-lifestream>=0.7.0",
    "torch-geometric",
    "pygod",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
    "playwright>=1.64.0",
    "pillow>=13.0.0",
]
# torch en dos variantes excluyentes: "cpu" (predeterminada, la usa CI) y "gpu" (CUDA 13,
# opcional para la RTX 4080 local). Ver CLAUDE.md.
cpu = ["torch>=2.14.1"]
gpu = ["torch>=2.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lavado"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integracion: pruebas del flujo completo (más lentas)",
]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

# torch de los índices de PyTorch: CPU por defecto (en Linux, PyPI trae la variante CUDA de
# ~2,5 GB) y CUDA 13 solo con el grupo "gpu".
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
